<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101720"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- rounded square, macOS-ish 22% radius -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#1a2230" stroke-width="4"/>

  <!-- faint node grid -->
  <g stroke="#1a2230" stroke-width="2" opacity="0.6">
    <path d="M128 64V448M256 64V448M384 64V448M64 128H448M64 256H448M64 384H448"/>
  </g>

  <!-- the cable: audio-cyan, sagging from top-left socket to bottom-right socket -->
  <path d="M136 168 C 136 330, 376 190, 376 344" fill="none" stroke="#22d3ee" stroke-width="30" stroke-linecap="round" filter="url(#glow)" opacity="0.95"/>
  <!-- a second, thinner CV cable crossing behind -->
  <path d="M376 168 C 376 300, 136 230, 136 344" fill="none" stroke="#f472b6" stroke-width="16" stroke-linecap="round" opacity="0.85"/>

  <!-- four sockets -->
  <g>
    <circle cx="136" cy="168" r="40" fill="#0d1117" stroke="#22d3ee" stroke-width="12"/>
    <circle cx="136" cy="168" r="14" fill="#22d3ee"/>
    <circle cx="376" cy="344" r="40" fill="#0d1117" stroke="#22d3ee" stroke-width="12"/>
    <circle cx="376" cy="344" r="14" fill="#22d3ee"/>
    <circle cx="376" cy="168" r="40" fill="#0d1117" stroke="#f472b6" stroke-width="12"/>
    <circle cx="376" cy="168" r="14" fill="#f472b6"/>
    <circle cx="136" cy="344" r="40" fill="#0d1117" stroke="#f472b6" stroke-width="12"/>
    <circle cx="136" cy="344" r="14" fill="#f472b6"/>
  </g>
</svg>
